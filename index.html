<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vernacular Learning App</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: Arial, sans-serif; margin:0; background:#f5f5f5; }
header { background:#4CAF50; color:white; padding:15px; text-align:center; }
.container { padding:20px; }
select, button { padding:10px; margin:5px 0; width:100%; }
.card { background:white; padding:15px; margin:10px 0; border-radius:8px; }
#aiResponse { background:#e8ffe8; padding:10px; border-radius:5px; margin-top:10px; }
</style>
</head>

<body>
<header>
<h2>Vernacular Learning App</h2>
<p>Learn Anytime • Any Language • Offline Ready</p>
</header>

<div class="container">

<h3>Select Language</h3>
<select id="langSelect">
<option value="en">English</option>
<option value="hi">Hindi</option>
<option value="pa">Punjabi</option>
<option value="ta">Tamil</option>
<option value="te">Telugu</option>
<option value="bn">Bengali</option>
</select>

<h3>Select Class / Level</h3>
<select id="classSelect">
<option>Class 1</option>
<option>Class 2</option>
<option>Class 3</option>
<option>Class 4</option>
<option>Class 5</option>
<option>Class 6</option>
<option>Class 7</option>
<option>Class 8</option>
<option>Class 9</option>
<option>Class 10</option>
<option>Class 11</option>
<option>Class 12</option>
<option>College – Engineering</option>
<option>College – Commerce</option>
<option>College – Arts</option>
</select>

<div class="card">
<h3>Study Material</h3>
<p id="notes">Notes will appear here based on your selection.</p>
<button onclick="loadNotes()">Load Notes</button>
</div>

<div class="card">
<h3>Video Lecture</h3>
<video width="100%" controls>
<source src="sample.mp4" type="video/mp4">
Your browser does not support video playback.
</video>
</div>

<div class="card">
<h3>AI Tutor</h3>
<input id="aiInput" placeholder="Ask your question..." style="width:100%; padding:10px;">
<button onclick="askAI()">Ask AI</button>
<div id="aiResponse"></div>
</div>

</div>

<script>
// Simple notes demo
function loadNotes() {
  const lang = document.getElementById("langSelect").value;
  const cls = document.getElementById("classSelect").value;

  const notes = {
    en: "Sample notes for " + cls + " in English.",
    hi: cls + " के लिए हिंदी में नमूना नोट्स।",
    pa: cls + " ਲਈ ਪੰਜਾਬੀ ਵਿੱਚ ਨਮੂਨਾ ਨੋਟਸ।",
    ta: cls + " க்கான தமிழ் குறிப்புகள்.",
    te: cls + " కోసం తెలుగు నోట్స్.",
    bn: cls + " এর জন্য বাংলা নোটস।"
  };

  document.getElementById("notes").innerText = notes[lang];
}

// AI tutor demo (placeholder)
function askAI() {
  const q = document.getElementById("aiInput").value;
  if (!q) return;

  document.getElementById("aiResponse").innerText =
    "AI Tutor: This is a demo response. In the real app, this will connect to an AI API.";
}
</script>

<!-- Offline Support -->
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
